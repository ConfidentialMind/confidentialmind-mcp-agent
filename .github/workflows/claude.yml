name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

# Default to no token permissions; grant per-job only (least privilege)
permissions: {}

concurrency:
  group: claude-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  CLAUDE_TRIGGER: "/claude"
  CLAUDE_MODEL: "claude-opus-4-5-20251101"

jobs:
  # ---------------------------
  # Read-only / non-destructive
  # ---------------------------
  claude_readonly:
    name: Claude (readonly)
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, env.CLAUDE_TRIGGER)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, env.CLAUDE_TRIGGER)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, env.CLAUDE_TRIGGER)) ||
      (github.event_name == 'issues' && (
        contains(github.event.issue.title, env.CLAUDE_TRIGGER) ||
        contains(github.event.issue.body, env.CLAUDE_TRIGGER)
      ))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Minimal perms to read repo and post a reply to the relevant surface
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Code (readonly)
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: ${{ env.CLAUDE_TRIGGER }}
          claude_args: |
            --model ${{ env.CLAUDE_MODEL }}
            --max-turns 8
          # Deny anything with side effects
          settings: |
            {
              "permissions": {
                "defaultMode": "dontAsk",
                "allow": ["Read", "Grep", "Glob", "LS"],
                "deny": ["Edit", "Write", "Bash"]
              }
            }

  # ------------------------------------------
  # Write-enabled (gated + explicit trigger)
  # ------------------------------------------
  claude_apply:
    name: Claude (apply - gated)
    # Only runs when explicitly requested with "/claude apply"
    # and the requester is an org member/collaborator/owner.
    if: |
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '/claude apply') &&
        contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '/claude apply') &&
        contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '/claude apply') &&
        contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
      ) || (
        github.event_name == 'issues' &&
        (contains(github.event.issue.title, '/claude apply') || contains(github.event.issue.body, '/claude apply')) &&
        contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Manual approval gate: configure Environment "claude-write" with required reviewers.
    environment: claude-write

    # Least privilege for making changes + opening/updating PRs + commenting
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Claude Code (apply)
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: ${{ env.CLAUDE_TRIGGER }}
          claude_args: |
            --model ${{ env.CLAUDE_MODEL }}
            --max-turns 12
          # Allow edits + tightly-scoped git operations; explicitly deny merges and other destructive actions.
          settings: |
            {
              "permissions": {
                "defaultMode": "dontAsk",
                "allow": [
                  "Read", "Grep", "Glob", "LS",
                  "Edit", "Write",

                  "Bash(git status:*)",
                  "Bash(git diff:*)",
                  "Bash(git log:*)",
                  "Bash(git show:*)",

                  "Bash(git checkout -b:*)",
                  "Bash(git add:*)",
                  "Bash(git commit:*)",

                  "Bash(git push origin HEAD:*)"
                ],
                "deny": [
                  # Keep merges human/manual
                  "Bash(git merge:*)",
                  "Bash(git rebase:*)",
                  "Bash(git cherry-pick:*)",
                  "Bash(gh pr merge:*)",
                  "Bash(gh pr merge *)",

                  # Prevent pushes to common protected branches
                  "Bash(git push * main:*)",
                  "Bash(git push * master:*)",
                  "Bash(git push * --force:*)",
                  "Bash(git push --force:*)",
                  "Bash(git push -f:*)",

                  # Block common high-risk commands (expand to your needs)
                  "Bash(rm:*)",
                  "Bash(sudo:*)",
                  "Bash(curl:*)",
                  "Bash(wget:*)",
                  "Bash(terraform:*)",
                  "Bash(pulumi:*)",
                  "Bash(kubectl:*)",
                  "Bash(helm:*)"
                ]
              }
            }
