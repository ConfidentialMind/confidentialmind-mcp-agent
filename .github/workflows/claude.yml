name: Claude Code

on:
  # issue_comment covers BOTH issues and PR comments
  issue_comment:
    types: [created]
  # line level coments
  pull_request_review_comment:
    types: [created]
  # PR review submissions
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (
        github.event_name == 'issue_comment' && 
        github.event.issue.pull_request &&
        (contains(github.event.comment.body, '@claude') || contains(github.event.comment.body, '/claude'))
      ) ||
      (
        github.event_name == 'pull_request_review_comment' && 
        (contains(github.event.comment.body, '@claude') || contains(github.event.comment.body, '/claude'))
      ) ||
      (
        github.event_name == 'pull_request_review' && 
        (contains(github.event.review.body, '@claude') || contains(github.event.review.body, '/claude'))
      )
    runs-on: ubuntu-latest
    permissions:
      # If we want to change Claude's access level in the future:
      # To enable write access, change 'read' to 'write' for the relevant permissions below
      contents: read # Change to 'write' to allow Claude to push commits
      pull-requests: write # Required to post comments (kept as write for responses)
      issues: read # Change to 'write' if you enable issue workflows later
      actions: read # Required for Claude to read CI results on PRs
      id-token: write # Required for OIDC token generation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Full history for better code context

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Support both @claude and /claude triggers
          trigger_phrase: "@claude"

          # Action ignores --allowedTools; use disallowedTools.
          # To enable write access later:
          # Remove "Edit, MultiEdit, Write"
          claude_args: |
            --model claude-opus-4-5-20251101
            --max-turns 20
            --disallowedTools "Edit,MultiEdit,Write,NotebookEdit,WebSearch,WebFetch,Bash,Task"
            --append-system-prompt "IMPORTANT CONSTRAINTS: You are running in READ-ONLY mode for code review purposes. You CANNOT: edit files, write files, run bash/shell commands, execute git operations, merge PRs, create branches, push commits, or search the web. You CAN: read files, search code with Grep, list directories with LS, use Glob to find files, and answer questions about the codebase. If a user requests a restricted action (e.g., 'merge this PR', 'apply these changes', 'edit this file'), politely decline and explain: 1) What you cannot do, 2) What you CAN do instead (e.g., suggest exact commands, provide code snippets the user can copy, explain the changes needed)."
