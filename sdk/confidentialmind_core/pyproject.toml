[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "confidentialmind-core"
version = "0.1.18"
license = {text = "Apache-2.0"}
authors = [
  { name="confidentialmind", email="info@confidentialmind.com" },
]
description = "Core functionality for interfacing with the ConfidentialMind stack"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic >= 2.8.2, < 3.0.0",
    "websockets >= 12.0",
    "python-dotenv",
    "openai >= 1.0.0",
    "aiohttp >= 3.8.0",
    "aiofiles >= 23.0.0",
    "requests >= 2",
]

[project.urls]
"Homepage" = "https://www.confidentialmind.com/"

[tool.setuptools]
packages = ["confidentialmind_core"]
